<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" role="img" aria-labelledby="title desc">
<title id="title">Atlas-E2G training, evaluation and gene-name query</title>
<desc id="desc">Public ChIP peak intervals and metadata become enhancer and promoter profiles. CRISPR functional-link labels fit an additive model. Reporter responses evaluate the promoter term only. The MYC gene-only query returns actual candidate-pair rankings; optional matched-cell DNase augments public references.</desc>
